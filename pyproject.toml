[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos-core"
version = "0.1.0"
description = "Speculative recurrent-depth Mythos-like architecture research implementation."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mythos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
